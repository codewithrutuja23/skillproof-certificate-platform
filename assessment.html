<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillProof - Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .logo span {
            color: #4169e1;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        .subtitle {
            color: #687386;
            font-size: 18px;
            line-height: 1.5;
        }

        .progress-text {
            margin-top: 20px;
            font-weight: bold;
            font-size: 17px;
        }

        .progress-box {
            width: 100%;
            height: 12px;
            background: #e3e7ef;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4169e1;
            transition: 0.3s;
        }

        .question-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .option {
            display: block;
            background: #f5f7fb;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }

        .option:hover {
            background: #e9edff;
        }

        .option input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .submit-btn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #4169e1;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0 30px;
        }

        .submit-btn:hover {
            background: #3155c7;
        }

        #result {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        #result h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        #review {
            text-align: left;
            margin-top: 25px;
        }

        .review-item {
            padding: 12px;
            border-radius: 10px;
            margin: 8px 0;
        }

        .correct {
            background: #e8f7ed;
            color: #18743a;
        }

        .wrong {
            background: #fdeaea;
            color: #b42323;
        }

        .action-btn {
            display: none;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #172033;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .certificate-btn {
            background: #4169e1;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            h1 {
                font-size: 30px;
            }

            .question {
                font-size: 19px;
            }

            .option {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Skill<span>Proof</span> 🎓
        </div>

        <h1>Final Assessment 📝</h1>

        <div class="subtitle">
            Web Development Basics
            <br>
            25 Questions • 25 Marks • Passing Score: 15/25
        </div>

        <div class="progress-text">
            Answered: <span id="answered">0</span> / 25
        </div>

        <div class="progress-box">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>

    <form id="quizForm"></form>

    <button class="submit-btn" id="submitBtn" onclick="submitAssessment()" type="button">
        Submit Assessment 🎯
    </button>

    <div id="result">

        <h2>Assessment Result 🎓</h2>

        <div id="score"></div>

        <div id="message"></div>

        <div id="review"></div>

        <button
            class="action-btn certificate-btn"
            id="certificateBtn"
            onclick="goToCertificate()"
            type="button">
            🎓 Get My Certificate
        </button>

        <button
            class="action-btn"
            id="retryBtn"
            onclick="location.reload()"
            type="button">
            🔄 Retry Assessment
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Tech Modern Language",
            "Hyper Transfer Machine Language"
        ],
        answer: 0
    },

    {
        question: "Which tag is used for the largest heading?",
        options: [
            "<h6>",
            "<h1>",
            "<heading>"
        ],
        answer: 1
    },

    {
        question: "Which tag creates a paragraph?",
        options: [
            "<p>",
            "<paragraph>",
            "<text>"
        ],
        answer: 0
    },

    {
        question: "Which tag creates a hyperlink?",
        options: [
            "<link>",
            "<a>",
            "<href>"
        ],
        answer: 1
    },

    {
        question: "Which language is used to style a webpage?",
        options: [
            "HTML",
            "CSS",
            "C"
        ],
        answer: 1
    },

    {
        question: "Which CSS property changes text color?",
        options: [
            "font-color",
            "text-color",
            "color"
        ],
        answer: 2
    },

    {
        question: "Which symbol is used for a CSS class selector?",
        options: [
            "#",
            ".",
            "*"
        ],
        answer: 1
    },

    {
        question: "Which symbol is used for a CSS ID selector?",
        options: [
            "#",
            ".",
            "@"
        ],
        answer: 0
    },

    {
        question: "Which HTML tag is used to insert an image?",
        options: [
            "<image>",
            "<img>",
            "<picture>"
        ],
        answer: 1
    },

    {
        question: "Which attribute specifies an image source?",
        options: [
            "src",
            "href",
            "link"
        ],
        answer: 0
    },

    {
        question: "Which language is mainly used to add interactivity to webpages?",
        options: [
            "JavaScript",
            "HTML",
            "CSS"
        ],
        answer: 0
    },

    {
        question: "Which keyword declares a JavaScript variable?",
        options: [
            "var",
            "variable",
            "declare"
        ],
        answer: 0
    },

    {
        question: "Which symbol is used for a single-line comment in JavaScript?",
        options: [
            "//",
            "<!-- -->",
            "##"
        ],
        answer: 0
    },

    {
        question: "Which method prints something to the browser console?",
        options: [
            "console.log()",
            "print.console()",
            "console.print()"
        ],
        answer: 0
    },

    {
        question: "Which HTML tag creates an unordered list?",
        options: [
            "<ol>",
            "<ul>",
            "<list>"
        ],
        answer: 1
    },

    {
        question: "Which HTML tag creates a list item?",
        options: [
            "<li>",
            "<item>",
            "<list-item>"
        ],
        answer: 0
    },

    {
        question: "Which CSS property changes the background color?",
        options: [
            "background-color",
            "bg-color",
            "background"
        ],
        answer: 0
    },

    {
        question: "Which CSS property controls text size?",
        options: [
            "text-size",
            "font-size",
            "size"
        ],
        answer: 1
    },

    {
        question: "Which HTML tag creates a button?",
        options: [
            "<button>",
            "<btn>",
            "<click>"
        ],
        answer: 0
    },

    {
        question: "Which HTML tag contains the main visible content of a webpage?",
        options: [
            "<head>",
            "<body>",
            "<mainpage>"
        ],
        answer: 1
    },

    {
        question: "Which tag contains information about the webpage?",
        options: [
            "<head>",
            "<info>",
            "<data>"
        ],
        answer: 0
    },

    {
        question: "Which CSS property makes text bold?",
        options: [
            "font-weight",
            "text-bold",
            "bold"
        ],
        answer: 0
    },

    {
        question: "Which JavaScript function displays a popup message?",
        options: [
            "alert()",
            "popup()",
            "message()"
        ],
        answer: 0
    },

    {
        question: "Which operator is commonly used to assign a value in JavaScript?",
        options: [
            "=",
            "==",
            "=>"
        ],
        answer: 0
    },

    {
        question: "Which file extension is commonly used for JavaScript?",
        options: [
            ".html",
            ".css",
            ".js"
        ],
        answer: 2
    }

];


const quizForm = document.getElementById("quizForm");


function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function loadQuestions() {

    let html = "";

    questions.forEach((q, index) => {

        html += `
            <div class="question-card">

                <div class="question">
                    ${index + 1}. ${escapeHTML(q.question)}
                </div>
        `;

        q.options.forEach((option, optionIndex) => {

            html += `
                <label class="option">

                    <input
                        type="radio"
                        name="question${index}"
                        value="${optionIndex}"
                        onchange="updateProgress()"
                    >

                    ${escapeHTML(option)}

                </label>
            `;

        });

        html += `</div>`;

    });

    quizForm.innerHTML = html;

}


function updateProgress() {

    let answered = 0;

    questions.forEach((q, index) => {

        const selected = document.querySelector(
            `input[name="question${index}"]:checked`
        );

        if (selected) {
            answered++;
        }

    });

    document.getElementById("answered").textContent = answered;

    const percentage = (answered / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";

}


function submitAssessment() {

    let score = 0;

    let answered = 0;

    let reviewHTML = "";

    questions.forEach((q, index) => {

        const selected = document.querySelector(
            `input[name="question${index}"]:checked`
        );

        if (selected) {

            answered++;

            const selectedAnswer = Number(selected.value);

            if (selectedAnswer === q.answer) {

                score++;

                reviewHTML += `
                    <div class="review-item correct">
                        ✅ Question ${index + 1}: Correct
                    </div>
                `;

            } else {

                reviewHTML += `
                    <div class="review-item wrong">
                        ❌ Question ${index + 1}: Incorrect
                        <br>
                        <small>
                            Correct option:
                            ${escapeHTML(q.options[q.answer])}
                        </small>
                    </div>
                `;

            }

        } else {

            reviewHTML += `
                <div class="review-item wrong">
                    ⚠️ Question ${index + 1}: Not answered
                    <br>
                    <small>
                        Correct option:
                        ${escapeHTML(q.options[q.answer])}
                    </small>
                </div>
            `;

        }

    });


    const percentage = Math.round(
        (score / questions.length) * 100
    );


    document.getElementById("score").textContent =
        score + " / 25 — " + percentage + "%";


    document.getElementById("review").innerHTML =
        reviewHTML;


    const result = document.getElementById("result");

    result.style.display = "block";


    document.getElementById("submitBtn").style.display =
        "none";


    if (score >= 15) {

        document.getElementById("message").textContent =
            "Congratulations! 🎉 You passed the assessment!";

        document.getElementById("certificateBtn").style.display =
            "block";

        document.getElementById("retryBtn").style.display =
            "none";

    } else {

        document.getElementById("message").textContent =
            "You didn't pass this time. Keep learning and try again! 💪";

        document.getElementById("certificateBtn").style.display =
            "none";

        document.getElementById("retryBtn").style.display =
            "block";

    }


    result.scrollIntoView({
        behavior: "smooth"
    });

}


function goToCertificate() {

    window.location.href = "certificate.html";

}


loadQuestions();

</script>

</body>
</html>
