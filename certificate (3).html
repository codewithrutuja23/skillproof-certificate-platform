<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate | SkillProof</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #eef2f7;
            min-height: 100vh;
            padding: 30px 15px;
            color: #172033;
        }

        .certificate {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 55px;
            border: 12px solid #172033;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        .certificate::before {
            content: "";
            position: absolute;
            inset: 15px;
            border: 2px solid #4169e1;
            pointer-events: none;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #4169e1;
        }

        .title {
            font-size: 48px;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            color: #687386;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .presented {
            margin-top: 45px;
            font-family: Arial, sans-serif;
            color: #687386;
        }

        #studentName {
            font-size: 42px;
            margin: 18px 0;
            color: #172033;
            font-style: italic;
        }

        .course-text {
            font-family: Arial, sans-serif;
            color: #687386;
            font-size: 16px;
        }

        #courseName {
            font-size: 28px;
            margin-top: 12px;
            color: #4169e1;
        }

        .seal {
            font-size: 55px;
            margin: 30px 0 15px;
        }

        .details {
            font-family: Arial, sans-serif;
            margin-top: 45px;
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .detail {
            flex: 1;
        }

        .detail-line {
            border-top: 1px solid #172033;
            padding-top: 8px;
            font-size: 13px;
        }

        #certificateId,
        #completionDate {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 13px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .download {
            background: #4169e1;
            color: white;
        }

        .verify {
            background: #22a06b;
            color: white;
        }

        .back {
            background: #172033;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 8px;
            }

            .certificate {
                padding: 35px 20px;
                border-width: 8px;
            }

            .title {
                font-size: 32px;
            }

            #studentName {
                font-size: 30px;
            }

            #courseName {
                font-size: 22px;
            }

            .details {
                flex-direction: column;
                gap: 25px;
            }

            button {
                width: 90%;
                margin: 6px auto;
            }
        }
    </style>
</head>

<body>

    <div class="certificate" id="certificate">

        <div class="logo">
            Skill<span>Proof</span> 🎓
        </div>

        <h1 class="title">
            CERTIFICATE
        </h1>

        <p class="subtitle">
            OF COURSE COMPLETION
        </p>

        <p class="presented">
            This certificate is proudly presented to
        </p>

        <h2 id="studentName">
            Student Name
        </h2>

        <p class="course-text">
            for successfully completing the course
        </p>

        <h3 id="courseName">
            Web Development Basics
        </h3>

        <div class="seal">
            🏆
        </div>

        <div class="details">

            <div class="detail">
                <p id="completionDate"></p>

                <div class="detail-line">
                    Completion Date
                </div>
            </div>

            <div class="detail">
                <p id="certificateId"></p>

                <div class="detail-line">
                    Certificate ID
                </div>
            </div>

        </div>

    </div>

    <div class="buttons">

        <button
            class="download"
            onclick="window.print()">
            🖨️ Download / Save Certificate
        </button>

        <button
            class="verify"
            onclick="window.location.href='verify.html'">
            🔐 Verify Certificate
        </button>

        <button
            class="back"
            onclick="history.back()">
            ← Back to Course
        </button>

    </div>

    <script>

        // STUDENT NAME
        const studentName =
            localStorage.getItem("studentName") || "Student Name";

        document.getElementById("studentName").innerText =
            studentName;


        // COURSE NAME
        const courseName =
            "Web Development Basics";

        document.getElementById("courseName").innerText =
            courseName;


        // COMPLETION DATE
        let savedDate =
            localStorage.getItem("completionDate");

        if (!savedDate) {

            const today = new Date();

            savedDate = today.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

            localStorage.setItem(
                "completionDate",
                savedDate
            );
        }

        document.getElementById("completionDate").innerText =
            savedDate;


        // CERTIFICATE ID
        let certificateId =
            localStorage.getItem("certificateId");

        if (!certificateId) {

            certificateId =
                "SP-" +
                Date.now().toString().slice(-8);

            localStorage.setItem(
                "certificateId",
                certificateId
            );
        }

        document.getElementById("certificateId").innerText =
            certificateId;


        // CERTIFICATE STATUS
        localStorage.setItem(
            "certificateStatus",
            "Valid"
        );

    </script>

</body>
</html>
